  <style>
    :root {
      --blue: #3b82f6;
      --yellow: #facc15;
      --red: #ef4444;
      --green: #22c55e;

      --bg: #ffffff;
      --card: #f8fafc;
      --text: #111;
      --muted: #666;
      --radius: 18px;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Nunito', sans-serif;
      background:linear-gradient(135deg,#dbeafe,#fef9c3,#fee2e2);
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:20px;
    }

    .login-box {
      width:100%;
      max-width:380px;
      background:#fff;
      border-radius:var(--radius);
      padding:28px;
      box-shadow:0 0 28px rgba(0,0,0,0.12);
      animation:pop 0.5s ease;
    }

    @keyframes pop {
      0% { opacity:0; transform:scale(0.9); }
      100% { opacity:1; transform:scale(1); }
    }

    .logo {
      text-align:center;
      margin-bottom:14px;
    }
    .logo img {
      width:70px;
      height:70px;
      border-radius:50%;
    }

    h2 {
      text-align:center;
      font-size:26px;
      font-weight:800;
      margin-bottom:6px;
    }
    p {
      text-align:center;
      color:var(--muted);
      margin-bottom:20px;
    }

    input {
      width:100%;
      padding:14px;
      margin-bottom:14px;
      border-radius:var(--radius);
      border:1px solid #ddd;
      font-size:15px;
      background:#fafafa;
      transition:0.3s;
    }

    input:focus {
      border-color:var(--blue);
      box-shadow:0 0 0 3px rgba(59,130,246,0.3);
      outline:none;
    }

    .btn {
      width:100%;
      padding:14px;
      background:var(--blue);
      border:none;
      color:#fff;
      font-size:16px;
      font-weight:800;
      border-radius:var(--radius);
      cursor:pointer;
      transition:0.2s;
    }
    .btn:hover {
      background:#2563eb;
      transform:translateY(-2px);
    }

    .links {
      margin-top:16px;
      text-align:center;
      font-size:14px;
    }
    .links a {
      color:var(--blue);
      text-decoration:none;
      font-weight:700;
    }

    #status {
      text-align:center;
      margin-top:10px;
      font-size:14px;
      color:var(--red);
      min-height:20px;
    }

    /* Mobile */
    @media (max-width:500px){
      .login-box { padding:22px; }
      h2 { font-size:22px; }
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      <img src="https://i.imgur.com/FpCLxvj.png" alt="Vexa Logo">
    </div>

    <h2>Welcome Back</h2>
    <p>Login to continue</p>

    <input id="email" type="email" placeholder="Email" autocomplete="email">
    <input id="password" type="password" placeholder="Password" autocomplete="current-password">

    <button class="btn" onclick="login()">Login</button>

    <div id="status"></div>

    <div class="links">
      <p>
        Don't have an account?
        <a href="signup.html">Sign Up</a>
      </p>
      <p>
        <a href="reset.html">Forgot Password?</a>
      </p>
    </div>

  </div>

  <script>
    const supabaseClient = supabase.createClient(
      "YOUR_SUPABASE_URL",
      "YOUR_SUPABASE_ANON_KEY"
    );

    async function login(){
      let email = document.getElementById("email").value.trim();
      let password = document.getElementById("password").value.trim();
      let status = document.getElementById("status");

      status.style.color = "black";
      status.innerHTML = "Checking...";

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if(error){
        status.style.color = "red";
        status.innerHTML = error.message;
      } else {
        status.style.color = "green";
        status.innerHTML = "Login successful! Redirecting...";
        setTimeout(() => {
          window.location.href = "dashboard.html";
        }, 900);
      }
    }
  </script>

</body>
</html>
