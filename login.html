<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VEXA Toys — Home</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');

    :root {
      --bg: #0b0e13;
      --card: #141820;
      --accent: #5b7fff;
      --accent2: #00e0ff;
      --text: #f2f5f7;
      --muted: #8b93a1;
      --radius: 14px;
    }

    * { box-sizing: border-box; margin:0; padding:0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Inter, system-ui;
    }

    /* NAVBAR */
    nav {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:22px 40px;
      background:#0c1017;
      border-bottom:1px solid rgba(255,255,255,0.05);
      position:sticky;
      top:0;
      z-index:10;
    }

    .brand {
      display:flex;
      align-items:center;
      gap:12px;
      font-weight:700;
      text-decoration:none;
      color: var(--text);
    }

    .logo-box {
      width:42px; height:42px;
      border-radius:12px;
      background: linear-gradient(135deg, #232832, #0e1117);
      display:flex;
      justify-content:center;
      align-items:center;
      color: var(--accent);
      font-weight:700;
      box-shadow: 0 0 10px rgba(91,127,255,0.3);
    }

    .nav-links a {
      margin-left:26px;
      text-decoration:none;
      color: var(--muted);
      font-weight:600;
      font-size:14px;
    }

    .login-btn {
      padding:10px 18px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      border-radius: var(--radius);
      color:#fff;
      text-decoration:none;
      font-weight:700;
      font-size:14px;
      transition:0.2s;
      margin-left:26px;
    }

    .login-btn:hover {
      box-shadow:0 0 20px rgba(0,224,255,0.35);
      transform:translateY(-1px);
    }

    /* HERO */
    .hero {
      display:flex;
      justify-content:space-between;
      align-items:center;
      padding:80px 40px 60px;
      gap:40px;
      flex-wrap:wrap;
    }

    .hero-text {
      flex:1;
      min-width:300px;
    }

    .hero-text h1 {
      font-size:46px;
      line-height:1.2;
      margin-bottom:14px;
      background: linear-gradient(90deg,var(--accent),var(--accent2));
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;
    }

    .hero-text p {
      color: var(--muted);
      font-size:16px;
      margin-bottom:24px;
    }

    .hero-btn {
      padding:14px 22px;
      background: var(--accent);
      border-radius:var(--radius);
      text-decoration:none;
      color:#fff;
      font-weight:700;
      display:inline-block;
      transition:0.2s;
    }

    .hero-btn:hover {
      box-shadow:0 0 16px rgba(91,127,255,0.3);
      transform: translateY(-2px);
    }

    .hero-img {
      flex:1;
      min-width:300px;
      border-radius:20px;
      overflow:hidden;
      box-shadow:0 0 30px rgba(0,0,0,0.4);
    }

    .hero-img img {
      width:100%;
      display:block;
      object-fit:cover;
    }

    /* GALLERY PREVIEW */
    .section {
      padding:40px;
    }

    .section h2 {
      font-size:28px;
      margin-bottom:10px;
    }

    .grid {
      display:grid;
      grid-template-columns:repeat(auto-fit, minmax(240px,1fr));
      gap:20px;
      margin-top:20px;
    }

    .card {
      background: var(--card);
      padding:14px;
      border-radius: var(--radius);
      box-shadow:0 0 20px rgba(0,0,0,0.3);
      transition:0.2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow:0 0 30px rgba(0,224,255,0.2);
    }

    .card img {
      width:100%;
      height:200px;
      object-fit:cover;
      border-radius: var(--radius);
    }

    .footer {
      text-align:center;
      padding:40px 20px;
      color: var(--muted);
      border-top:1px solid rgba(255,255,255,0.05);
      margin-top:40px;
    }

  </style>
</head>

<body>

  <!-- NAV -->
  <nav>
    <a class="brand" href="#">
      <div class="logo-box">V</div>
      VEXA TOYS
    </a>

    <div class="nav-links">
      <a href="#gallery">Gallery</a>
      <a href="#reels">Reels</a>
      <a href="#contact">Contact</a>

      <!-- Login button -->
      <a class="login-btn" href="login.html">Login</a>
    </div>
  </nav>

  <!-- HERO -->
  <section class="hero">
    <div class="hero-text">
      <h1>Premium Diecast Photography</h1>
      <p>Explore high-end toy car shots, cinematic reels, and custom edits crafted by VEXA Toys.</p>

      <a class="hero-btn" href="#gallery">Explore Gallery</a>
    </div>

    <div class="hero-img">
      <img src="assets/hero-car.jpg" alt="Hero Toy Car Image">
    </div>
  </section>

  <!-- GALLERY PREVIEW -->
  <section id="gallery" class="section">
    <h2>Latest Shots</h2>

    <div class="grid">
      <div class="card"><img src="assets/sample1.jpg" alt=""></div>
      <div class="card"><img src="assets/sample2.jpg" alt=""></div>
      <div class="card"><img src="assets/sample3.jpg" alt=""></div>
      <div class="card"><img src="assets/sample4.jpg" alt=""></div>
    </div>
  </section>

  <!-- FOOTER -->
  <div class="footer">
    © 2025 VEXA TOYS — Crafted for Diecast Lovers
  </div>

</body>
</html>
